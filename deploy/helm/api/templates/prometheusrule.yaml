{{- if .Values.prometheusRule.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ .Release.Name }}-api-slo
  labels:
    release: kps
spec:
  groups:
    - name: api.operations
      interval: 30s
      rules:
        # Aggregate request volume is available; response status is not labelled yet.
        - record: api:request_rate:5m
          expr: sum(rate(api_requests_total[5m]))

        # Operational queue alert. Do not call this an availability SLO/burn alert.
        - alert: APIQueueBacklog
          expr: max(api_jobs_pending) > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Job queue is backing up
            description: |
              The highest API replica api_jobs_pending gauge has exceeded 100 for 5 minutes.
              Check worker health and database connectivity.
{{- end }}
