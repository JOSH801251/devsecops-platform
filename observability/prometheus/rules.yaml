groups:
  - name: api.operations
    interval: 30s
    rules:
      # The API exports an aggregate request counter without status labels.
      # This recording rule measures traffic volume, not availability or error rate.
      - record: api:request_rate:5m
        expr: sum(rate(api_requests_total[5m]))

      # Queue backlog is an operational signal, not an availability SLO.
      - alert: APIQueueBacklog
        expr: max(api_jobs_pending) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API job queue is backing up"
          description: "The highest API replica pending-job gauge has exceeded 100 for 5 minutes; check worker health and database connectivity."
